name: whatsapp-pair
run-name: whatsapp-pair · entwin-user:${{ github.event.inputs.user_email || 'all' }}

# ONE-TIME device pairing for a WhatsApp number. Dispatch this manually with the
# user's email and phone number; read the printed pairing code from the job log
# and enter it on the phone within the timeout. On success the device
# credentials are saved to Redis and the hourly whatsapp-sync job takes over.
#
# You only need this once per user (or again if they unlink the device). Pairing
# is the only step that needs a live socket, and this job holds it just long
# enough for the code round-trip.
on:
  workflow_dispatch:
    inputs:
      user_email:
        description: "User's email (the app account this WhatsApp attaches to)"
        required: true
      phone:
        description: 'WhatsApp number, digits incl. ISD code (e.g. 13125551234)'
        required: true
      force_repair:
        description: 'Wipe any existing link first (use if re-pairing a device that shows Linked but fails)'
        required: false
        type: boolean
        default: false

concurrency:
  group: wa-pair-${{ github.event.inputs.user_email }}
  cancel-in-progress: false

jobs:
  whatsapp-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: worker
        run: npm install --omit=dev
      - name: Pair WhatsApp device
        working-directory: worker
        env:
          USER_EMAIL: ${{ github.event.inputs.user_email }}
          WA_PHONE: ${{ github.event.inputs.phone }}
          FORCE_REPAIR: ${{ github.event.inputs.force_repair }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Give yourself time to open the app and type the code.
          WA_PAIR_TIMEOUT_MS: '300000'
        run: npm run pair
