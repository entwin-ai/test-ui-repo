name: gmail-delta

# Differential sync across connected Gmail accounts (gmail rows in sync_state).
#
# HEARTBEAT vs PER-USER CADENCE:
# This cron is only a HEARTBEAT. On each tick the worker inspects every gmail
# account and runs delta for one ONLY if that user's chosen "Reading frequency"
# (pollHours in connector_state.settings) has elapsed since the account's last
# successful delta (sync_state.last_delta_at). So user X on 3h and user Y on 10h
# each sync at their own cadence off this single schedule — see worker
# lib/schedule.js and the Gmail delta loop in worker/src/index.js.
#
# Hourly, because the smallest selectable frequency is 1 hour; a finer tick
# would just skip most accounts every time. Bump to '*/30 * * * *' if you later
# allow sub-hourly frequencies, or drive workflow_dispatch from pg_cron /
# Trigger.dev / QStash for tighter guarantees.
#
# CAVEAT: GitHub cron is best-effort — runs can be delayed 15-30+ min or skipped
# under load, and the schedule auto-DISABLES after 60 days of repo inactivity.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: delta-all
  cancel-in-progress: false

jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: worker
        run: npm install --omit=dev
      - name: Run delta
        working-directory: worker
        env:
          MODE: delta
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # LLM keys are per-user now, read from Redis by the worker.
          # This secret decrypts them (shared with the app).
          ENTWIN_KEY_SECRET: ${{ secrets.ENTWIN_KEY_SECRET }}
          # Optional embedding-model overrides (Option A). Safe to omit —
          # the worker falls back to sensible defaults if these are unset.
          CLAUDE_EMBED_MODEL: ${{ secrets.CLAUDE_EMBED_MODEL }}
          OPENAI_EMBED_MODEL: ${{ secrets.OPENAI_EMBED_MODEL }}
          GEMINI_EMBED_MODEL: ${{ secrets.GEMINI_EMBED_MODEL }}
          # Perf tuning (optional). Concurrency = emails processed in parallel.
          # Default 6 if unset. Lower it if you still hit rate limits.
          INGEST_CONCURRENCY: ${{ vars.INGEST_CONCURRENCY }}
        run: npm start
