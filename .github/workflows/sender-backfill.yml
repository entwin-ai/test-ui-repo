name: gmail-sender-backfill

# Dispatched by POST /api/gmail/ingest after a Gmail card connects.
on:
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Scope to one user email (blank = all pending)'
        required: false
        default: ''
      card_id:
        description: 'gmail-personal | gmail-professional (blank = all)'
        required: false
        default: ''
      sender:
        description: 'Exact sender address to reprocess (required)'
        required: true
        default: ''

concurrency:
  group: backfill-${{ github.event.inputs.user_email }}-${{ github.event.inputs.card_id }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: worker
        run: npm install --omit=dev
      - name: Run backfill
        working-directory: worker
        env:
          MODE: sender-backfill
          ONLY_USER: ${{ github.event.inputs.user_email }}
          ONLY_CARD: ${{ github.event.inputs.card_id }}
          ONLY_SENDER: ${{ github.event.inputs.sender }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # LLM keys are per-user now, read from Redis by the worker.
          # This secret decrypts them (shared with the app).
          ENTWIN_KEY_SECRET: ${{ secrets.ENTWIN_KEY_SECRET }}
          # Optional embedding-model overrides (Option A). Safe to omit —
          # the worker falls back to sensible defaults if these are unset.
          CLAUDE_EMBED_MODEL: ${{ secrets.CLAUDE_EMBED_MODEL }}
          OPENAI_EMBED_MODEL: ${{ secrets.OPENAI_EMBED_MODEL }}
          GEMINI_EMBED_MODEL: ${{ secrets.GEMINI_EMBED_MODEL }}
          # Perf tuning (optional). Concurrency = emails processed in parallel.
          # Default 6 if unset. Lower it if you still hit rate limits.
          INGEST_CONCURRENCY: ${{ vars.INGEST_CONCURRENCY }}
        run: npm start
