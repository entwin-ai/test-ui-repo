name: slack-move-backfill
run-name: slack-move-backfill · entwin-user:${{ github.event.inputs.user_email || 'all' }}

# Dispatched by PATCH /api/slack/entities when the user moves an entity from the
# Updates column to the Important column on the Slack Kanban (Read Me §8). It
# re-expands that ONE entity's past Updates days (one-line gists) into full
# facet-split Memory Notes, dated to each day's original messages. Idempotent:
# re-running produces the same end state. Runs as its own dispatched job (not
# inline in the web request) because it can be heavy at channel scale.
on:
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Scope to one user email (required)'
        required: true
        default: ''
      identity_key:
        description: 'The Slack entity identity key to re-expand (user id / channel id / group DM id / external key)'
        required: true
        default: ''

concurrency:
  # Never overlap two backfills for the same entity, and don't fight a sync for
  # the same user (both write memory_note for that user).
  group: slack-move-${{ github.event.inputs.user_email }}-${{ github.event.inputs.identity_key }}
  cancel-in-progress: false

jobs:
  move-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: worker
        run: npm install --omit=dev
      - name: Run Slack move backfill
        working-directory: worker
        env:
          MODE: slack-move-backfill
          ONLY_USER: ${{ github.event.inputs.user_email }}
          ONLY_IDENTITY_KEY: ${{ github.event.inputs.identity_key }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ENTWIN_KEY_SECRET: ${{ secrets.ENTWIN_KEY_SECRET }}
          CLAUDE_EMBED_MODEL: ${{ secrets.CLAUDE_EMBED_MODEL }}
          OPENAI_EMBED_MODEL: ${{ secrets.OPENAI_EMBED_MODEL }}
          GEMINI_EMBED_MODEL: ${{ secrets.GEMINI_EMBED_MODEL }}
          INGEST_CONCURRENCY: ${{ vars.INGEST_CONCURRENCY }}
        run: npm start
